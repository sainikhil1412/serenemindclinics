name: Deploy Static Content to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/pages-primer@v1 # Initializes pages routing configuration

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # CHANGE THIS to your actual subdirectory name
          path: './web_scraping/modernized'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4